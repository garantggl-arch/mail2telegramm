[package]
name = "mail2telegram"
version = "0.2.0"
description = "Desktop app that turns emails into Telegram posts"
authors = ["Mail2Telegram"]
edition = "2021"

[lib]
name = "mail2telegram_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-notification = "2.3"
tauri-plugin-autostart = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
runtime-tokio = { package = "tokio", version = "1", features = ["rt-multi-thread", "time", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "3"
tiny_http = "0.12"
webbrowser = "1"
base64 = "0.22"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
